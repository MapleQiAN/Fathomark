[project]
name = "fathomark"
version = "0.1.0"
description = "Fathomark 渊衡 — evidence-driven multi-agent equity scoring"
requires-python = ">=3.12"
dependencies = ["fathomark-core", "fathomark-storage", "fathomark-api"]

[tool.uv.sources]
fathomark-core = { workspace = true }
fathomark-storage = { workspace = true }
fathomark-api = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]

[tool.ruff]
target-version = "py312"
