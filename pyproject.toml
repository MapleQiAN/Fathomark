[project]
name = "fathomark"
version = "0.1.0"
description = "Fathomark 渊衡 — evidence-driven multi-agent equity scoring"
requires-python = ">=3.12"
dependencies = ["fathomark-core", "fathomark-storage", "fathomark-api", "fathomark-sdk", "fathomark-providers", "fathomark-agents", "fathomark-reporting"]

[tool.uv.sources]
fathomark-core = { workspace = true }
fathomark-storage = { workspace = true }
fathomark-api = { workspace = true }
fathomark-sdk = { workspace = true }
fathomark-providers = { workspace = true }
fathomark-agents = { workspace = true }
fathomark-reporting = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Naive datetimes are deliberate here: naive DateTime columns must roundtrip
# without tz for equality checks against both backends.
"packages/storage/tests/test_postgres.py" = ["DTZ001"]
