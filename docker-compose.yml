services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      FATHOMARK_DATA_DIR: /data
      FATHOMARK_FRAMEWORK_DIR: /app/frameworks
      FATHOMARK_DEMO_FIXTURE_DIR: /app/examples/fixtures/adbe_2026-09-03
    ports:
      - "8000:8000"
    volumes:
      - fathomark-data:/data

volumes:
  fathomark-data:
