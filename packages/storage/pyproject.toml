[project]
name = "fathomark-storage"
version = "0.1.0"
description = "Storage layer for Fathomark"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13", "fathomark-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathomark_storage"]

# Ship migrations as package data so migrate_db works from an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "fathomark_storage/alembic"

[tool.uv.sources]
fathomark-core = { workspace = true }
