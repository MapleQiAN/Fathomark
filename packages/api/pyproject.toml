[project]
name = "fathomark-api"
version = "0.1.0"
description = "Headless REST API for Fathomark"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fathomark-agents",
    "fathomark-core",
    "fathomark-providers",
    "fathomark-storage",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathomark_api"]

[tool.uv.sources]
fathomark-agents = { workspace = true }
fathomark-core = { workspace = true }
fathomark-providers = { workspace = true }
fathomark-storage = { workspace = true }
