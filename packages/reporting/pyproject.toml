[project]
name = "fathomark-reporting"
version = "0.1.0"
description = "Deterministic report models and renderers for Fathomark"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "fathomark-core"]

[project.optional-dependencies]
pdf = ["playwright>=1.50", "pypdf>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathomark_reporting"]

[tool.uv.sources]
fathomark-core = { workspace = true }
