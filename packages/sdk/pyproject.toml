[project]
name = "fathomark-sdk"
version = "0.1.0"
description = "Python client for the Fathomark headless API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathomark_sdk"]
