[project]
name = "fathomark-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fathomark-core",
    "fathomark-providers",
    "fathomark-storage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathomark_agents"]

[tool.uv.sources]
fathomark-core = { workspace = true }
fathomark-providers = { workspace = true }
fathomark-storage = { workspace = true }
